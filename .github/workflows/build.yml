name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Check for warnings
        run: |
          output=$(swift build -c release 2>&1)
          if echo "$output" | grep -qi "warning:"; then
            echo "$output"
            exit 1
          fi
